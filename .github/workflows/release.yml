name: Release

# Publishes the Agent Skill as a zip on a GitHub release, for agents other than Claude Code
# (GitHub Copilot, Cursor, Codex: unzip into .agents/skills/; claude.ai: upload the zip).
# Tag with CalVer (YYYY.MM.DD), e.g. `git tag 2026.11.09 && git push origin 2026.11.09`.

on:
  push:
    tags: ["20[0-9][0-9].*"]

permissions:
  contents: write

jobs:
  release:
    # Only the canonical org repo publishes releases.
    if: github.repository == 'SchneiderElectricBuildings/se-ai-devkit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check generated files are current
        run: |
          uv sync --locked --project tools
          uv run --project tools devkit validate
          uv run --project tools devkit llms --check
          uv run --project tools devkit skill --check

      - name: Build skill zip
        run: uv run --project tools devkit skill --zip dist/building-data-platform-api.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/building-data-platform-api.zip
          --title "$GITHUB_REF_NAME" --generate-notes
