name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # ADR-0001: only the canonical org repo publishes. Forks and the personal dev repo never do.
    if: github.repository == 'SchneiderElectricBuildings/buildings-ai-devkit'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check generated files are current
        run: |
          uv sync --locked --project tools
          uv run --project tools devkit validate
          uv run --project tools devkit llms --check

      - name: Assemble site
        run: |
          mkdir _site
          cp -r docs _site/docs
          cp -r public/. _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
