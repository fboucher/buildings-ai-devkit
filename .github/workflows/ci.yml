name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --locked --project tools

      - name: Lint
        run: |
          uv run --project tools ruff check tools
          uv run --project tools ruff format --check tools

      - name: Test
        run: uv run --project tools pytest tools

      - name: Validate docs
        run: uv run --project tools devkit validate

      - name: Check llms.txt is up to date
        run: uv run --project tools devkit llms --check

      - name: Check the skill is up to date
        run: uv run --project tools devkit skill --check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run the gitleaks container directly: gitleaks-action needs a paid license for
      # organization repos.
      - name: Scan for secrets
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          dir /repo --redact --no-banner
